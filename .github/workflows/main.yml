
name: Build A&P Craft

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Minecraft mod
        run: |
          gradle build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: gradle-build.log

      - name: Save Minecraft mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apcraft-mod
          path: build/libs/*.jar
